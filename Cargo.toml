[workspace]
members = ["crates/core", "crates/protocol", "crates/audio", "crates/lv2", "crates/service", "crates/gui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
libloading = "0.8"
libc = "0.2"
alixer-core = { path = "crates/core" }
alixer-protocol = { path = "crates/protocol" }
alixer-audio = { path = "crates/audio" }
alixer-lv2 = { path = "crates/lv2" }

[profile.release]
lto = "thin"

