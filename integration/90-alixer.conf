wireplumber.components = [
  {
    name = alixer-guard.lua
    type = script/lua
    provides = custom.alixer-guard
    requires = [ support.standard-event-source ]
  }
  {
    type = virtual
    provides = custom.alixer
    wants = [ custom.alixer-guard ]
  }
]
wireplumber.profiles = {
  # Keep WirePlumber usable if Alixer is later uninstalled while a user's
  # activation fragment remains in their home directory.
  main = { custom.alixer = required }
}
